<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roku AI Security</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; }
        .header { background: #1a1a2e; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #6c2bd9; }
        .header h1 { font-size: 20px; color: #a855f7; }
        .header .status { font-size: 13px; color: #888; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto; }
        .camera-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .camera-card .stream { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; }
        .camera-card .stream img { width: 100%; height: 100%; object-fit: contain; }
        .camera-card .info { padding: 12px 16px; }
        .camera-card .info h3 { font-size: 15px; margin-bottom: 6px; }
        .camera-card .info .detections { font-size: 13px; color: #aaa; }
        .camera-card .info .alert { color: #ef4444; font-weight: 600; }
        .camera-card .info .ok { color: #22c55e; }
        .sidebar { background: #1a1a2e; border-radius: 12px; padding: 16px; border: 1px solid #333; }
        .sidebar h2 { font-size: 16px; color: #a855f7; margin-bottom: 12px; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .events-list { max-height: 400px; overflow-y: auto; }
        .event-item { padding: 8px 0; border-bottom: 1px solid #222; font-size: 13px; }
        .event-item .time { color: #666; }
        .event-item .type { color: #a855f7; font-weight: 600; }
        .controls { padding: 16px; display: flex; gap: 12px; justify-content: center; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #6c2bd9; color: white; }
        .btn-primary:hover { background: #7c3aed; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #ef4444; }
        .refresh { color: #666; font-size: 12px; text-align: center; padding: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Roku AI Security</h1>
        <div class="status" id="connStatus">Connecting...</div>
    </div>

    <div class="grid">
        <div class="camera-card">
            <div class="stream">
                <img id="liveFeed" src="/api/stream" alt="Live Camera Feed">
            </div>
            <div class="info">
                <h3>Camera <span class="ok" id="camStatus">● Online</span></h3>
                <div class="detections" id="detections">Waiting for detections...</div>
            </div>
        </div>

        <div>
            <div class="sidebar">
                <h2>Statistics</h2>
                <div class="stat-row"><span>Total Events</span><span id="statTotal">0</span></div>
                <div class="stat-row"><span>Today</span><span id="statToday">0</span></div>
                <div class="stat-row"><span>Detections</span><span id="statDetect">0</span></div>
                <div class="stat-row"><span>Motion Events</span><span id="statMotion">0</span></div>
            </div>

            <div class="sidebar" style="margin-top: 16px;">
                <h2>Recent Events</h2>
                <div class="events-list" id="eventsList">
                    <div class="event-item">No events yet</div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="takeSnapshot()">Take Snapshot</button>
        <button class="btn btn-primary" onclick="refreshEvents()">Refresh Events</button>
    </div>
    <div class="refresh" id="refreshInfo">Auto-refreshes every 2s</div>

    <script>
        const liveFeed = document.getElementById('liveFeed');
        let feedVersion = 0;

        function updateFeed() {
            feedVersion++;
            liveFeed.src = `/api/stream?t=${feedVersion}`;
        }

        setInterval(updateFeed, 2000);

        async function updateStatus() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();
                document.getElementById('connStatus').textContent = 'Connected';
                const cam = data.cameras?.main;
                if (cam?.online) {
                    document.getElementById('camStatus').textContent = '● Online';
                    document.getElementById('camStatus').className = 'ok';
                } else {
                    document.getElementById('camStatus').textContent = '● Offline';
                    document.getElementById('camStatus').className = 'alert';
                }
                const dets = data.latest_detections?.main || [];
                if (dets.length > 0) {
                    const labels = dets.map(d => `${d.label} (${Math.round(d.confidence*100)}%)`).join(', ');
                    document.getElementById('detections').textContent = `Detected: ${labels}`;
                } else {
                    document.getElementById('detections').textContent = 'No objects detected';
                }
                document.getElementById('statTotal').textContent = data.stats?.total_events || 0;
                document.getElementById('statToday').textContent = data.stats?.today_events || 0;
                document.getElementById('statDetect').textContent = data.stats?.by_type?.detection || 0;
                document.getElementById('statMotion').textContent = data.stats?.by_type?.motion || 0;
            } catch (e) {
                document.getElementById('connStatus').textContent = 'Disconnected';
            }
        }

        async function refreshEvents() {
            try {
                const resp = await fetch('/api/events?limit=20');
                const events = await resp.json();
                const list = document.getElementById('eventsList');
                if (events.length === 0) {
                    list.innerHTML = '<div class="event-item">No events yet</div>';
                    return;
                }
                list.innerHTML = events.map(e => {
                    const t = new Date(e.timestamp * 1000).toLocaleTimeString();
                    const dets = JSON.parse(e.detections || '[]');
                    const labels = dets.map(d => d.label).join(', ');
                    return `<div class="event-item">
                        <span class="time">${t}</span>
                        <span class="type">${e.event_type}</span>
                        ${labels ? ' - ' + labels : ''}
                    </div>`;
                }).join('');
            } catch (e) {}
        }

        async function takeSnapshot() {
            const resp = await fetch('/api/snapshot');
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `snapshot_${Date.now()}.png`;
            a.click();
            URL.revokeObjectURL(url);
        }

        updateStatus();
        refreshEvents();
        setInterval(updateStatus, 5000);
        setInterval(refreshEvents, 10000);
    </script>
</body>
</html>
